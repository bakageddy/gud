[backdrop]
blur_intensity = 0.29999999999999999
enabled = true

[bar]
order = [ "main" ]

    [bar.main]
    auto_hide = false
    center = [ "clock" ]
    enabled = true
    end = [ "weather", "bluetooth", "volume", "brightness", "network", "battery" ]
    font_family = "SF Mono Medium"
    font_weight = "bold"
    layer = "top"
    margin_edge = 0
    margin_ends = 0
    padding = 28
    position = "top"
    radius_bottom_left = -32
    radius_bottom_right = -32
    # radius_top_left = -32
    # radius_top_right = -32
    reserve_space = true
    start = [ "launcher", "workspaces" ]

[control_center]
sidebar = "full"
sidebar_section = "compact"

[desktop_widgets]
enabled = true
schema_version = 2
widget_order = [ "weather_main", "media_player_main", "clock_main" ]

    [desktop_widgets.grid]
    cell_size = 24
    enabled = true
    major_interval = 4
    visible = true

    [desktop_widgets.widget.clock_main]
    box_height = 96.0
    box_width = 176.0
    cx = 1616.0
    cy = 264.0
    output = "eDP-1"
    rotation = 0.0
    type = "clock"

    [desktop_widgets.widget.media_player_main]
    box_height = 144.0
    box_width = 368.0
    cx = 1704.0
    cy = 400.0
    output = "eDP-1"
    rotation = 0.0
    type = "media_player"

    [desktop_widgets.widget.weather_main]
    box_height = 96.0
    box_width = 176.0
    cx = 1800.0
    cy = 264.0
    output = "eDP-1"
    rotation = 0.0
    type = "weather"

        [desktop_widgets.widget.weather_main.settings]
        color = "on_surface"
        shadow = true

[dock]
auto_hide = true
enabled = true
launcher_position = "end"
pinned = [ "ghostty", "com.discordapp.Discord", "zen" ]
position = "bottom"
reserve_space = false
show_running = true

[location]
address = "Chennai, India"
auto_locate = false

[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [
    "lockscreen-widget-0000000000000001",
    "lockscreen-login-box@winit",
    "lockscreen-login-box@HDMI-A-1",
    "lockscreen-login-box@eDP-1",
    "lockscreen-widget-0000000000000003"
]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1"]
    box_height = 0.0
    box_width = 0.0
    cx = 960.0
    cy = 957.0
    output = "HDMI-A-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@HDMI-A-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        input_opacity = 1.0
        input_radius = 6.0
        show_login_button = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 0.0
    box_width = 0.0
    cx = 960.0
    cy = 1077.0
    output = "eDP-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        input_opacity = 1.0
        input_radius = 6.0
        show_login_button = true

    [lockscreen_widgets.widget."lockscreen-login-box@winit"]
    box_height = 0.0
    box_width = 0.0
    cx = 750.0
    cy = 1003.0
    output = "winit"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@winit".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        input_opacity = 1.0
        input_radius = 6.0
        show_login_button = true

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000001]
    box_height = 320.0
    box_width = 720.0
    cx = 1552.0
    cy = 664.0
    output = "eDP-1"
    rotation = 0.0
    type = "clock"

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000003]
    box_height = 352.0
    box_width = 720.0
    cx = 1552.0
    cy = 312.0
    output = "eDP-1"
    rotation = 0.0
    type = "sticker"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000003.settings]
        image_path = "/home/dinesh-24010/Pictures/stradale.png"
        opacity = 1.0

[notification]
enable_daemon = true

[shell]
font_family = "SF Mono"
niri_overview_type_to_launch_enabled = true

    [shell.screen_corners]
    enabled = true
	size = 48

[theme]
builtin = "Gruvbox"
community_palette = "Tokyo Night Moon"
mode = "dark"
source = "builtin"
wallpaper_scheme = "m3-tonal-spot"

[wallpaper]
directory = "/home/dinesh-24010/.config/wallpapers"
enabled = true
transistion_duration = 1500
transistion_on_startup = true

    [wallpaper.automation]
    enabled = false
    interval_seconds = 360
    order = "random"
    recursive = true

    [wallpaper.default]
    path = "/home/dinesh-24010/.config/wallpapers/pixels/pixeledCity.png"

    [wallpaper.last]
    path = "/home/dinesh-24010/.config/wallpapers/pixels/pixeledCity.png"

    [wallpaper.monitors.HDMI-A-1]
    path = "/home/dinesh-24010/.config/wallpapers/pixels/pixeledCity.png"

    [wallpaper.monitors.eDP-1]
    path = "/home/dinesh-24010/.config/wallpapers/pixels/pixeledCity.png"

[weather]
enabled = true

[widget.battery]
capsule_opacity = 0.0
capsule_padding = 12.0

[widget.launcher]
capsule_opacity = 0.0
capsule_padding = 13.0
glyph = "brand-apple-filled"

[widget.media]
album_art_only = true
hide_when_no_media = true
max_length = 201

[widget.spacer_2]
length = 40
type = "spacer"

[widget.workspaces]
minimal = true
