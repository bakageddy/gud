set -sg default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:RGB"
set -as terminal-features ",xterm-256color:RGB"
set -g mouse on

set -g base-index 1
setw -g pane-base-index 1

set -g allow-passthrough on
set -g set-clipboard on
set -g renumber-windows on
set -g extended-keys on
set -g history-limit 250000

set -g display-time 2000
set -s focus-events on

set-window-option -g mode-keys vi

# source-file ~/.config/tmux/themes/.tmux
source-file ~/.config/tmux/themes/gruvbox.tmux
# source-file ~/.config/tmux/themes/osaka.tmux
# source-file ~/.config/tmux/themes/modus_vivendi.tmux
run-shell ~/.config/tmux/plugins/tmux-resurrect/resurrect.tmux
set -g focus-events on
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel
# (- replaces the default delete-buffer key; % and " keep working)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
# New windows open in the current directory too
bind c new-window -c "#{pane_current_path}"
# Prefix + h/j/k/l moves between panes like Vim
# (l replaces last-window; Prefix + ; still goes to the last pane)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
# Prefix + H/J/K/L resizes the pane by 5 cells; hold the letter to repeat
# (L replaces switch-client -l)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ── Status line ───────────────────────────────────────────────────────
# Redraw the status line every 5 seconds (default 15)
set -g status-interval 5
# set -g status-style bg=default
# set -g status-left-length 99
# set -g status-right-length 99
# set -g status-justify absolute-centre

bind r source-file ~/.config/tmux/tmux.conf \; display-message "~/.config/tmux/tmux.conf reloaded"
set -s set-clipboard on
